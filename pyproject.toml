[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-mcp"
version = "0.1.1"
description = "An MCP server for RL training: watch, diagnose and steer a running job from an agent or a shell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Takahiro Miki" }
]
keywords = ["mcp", "model-context-protocol", "reinforcement-learning", "robotics", "mujoco", "mjlab", "agentic-ai", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
rlmcp = "rlmcp.cli:main"
# `rlmcp train` and `rlmcp serve` are the same code; these names exist because
# the docs use them and because `claude mcp add rlmcp -- rlmcp-server ...` reads
# better than a subcommand. Prefixed, since mjlab installs a bare `train`.
rlmcp-train = "rlmcp.train:main"
rlmcp-server = "rlmcp.server.mcp_server:main"

[project.urls]
Homepage = "https://github.com/mktk1117/rl-mcp"
Repository = "https://github.com/mktk1117/rl-mcp"
Documentation = "https://github.com/mktk1117/rl-mcp/tree/main/docs"
Issues = "https://github.com/mktk1117/rl-mcp/issues"
Changelog = "https://github.com/mktk1117/rl-mcp/releases"

[project.optional-dependencies]
server = [
    "mcp>=1.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # Pinned to the version CI runs, so `ruff check` locally and `ruff check` on
    # a pull request are the same check. black is deliberately absent: it is a
    # 4-space formatter and this tree indents by two — see [tool.ruff] below.
    "ruff==0.16.4",
]
mjlab = [
    "mjlab>=1.5.0",
    "torch>=2.0.0",
    "mujoco>=3.0.0",
]
# The live browser view (`rlmcp view`). Not a hard dependency of anything: a
# build without it keeps every other command and says what is missing when
# somebody asks for a view. mjlab already pulls viser in for its own viewer, so
# this extra is for an install that wants the view without the rest.
viser = [
    "viser>=1.0.0",
]

# Third-party capabilities register themselves by publishing an entry point in
# this group; see rlmcp/extensions/__init__.py.
#   [project.entry-points."rlmcp.extensions"]
#   my_capability = "my_project.rlmcp_ext"

[tool.setuptools.packages.find]
where = ["."]
include = ["rlmcp*"]

# Everything the package reads off its own directory at runtime. A wheel is
# built from this list, not from git: the record graph's vendored libraries
# and its template were in every checkout and in no install until they were
# named here, and `rlmcp record` in an installed copy quietly fell back to the
# plain engine. CI's `package` job installs the wheel and checks for them.
[tool.setuptools.package-data]
rlmcp = [
    "py.typed",
    "records/vendor/*.js",
    "records/vendor/README.md",
    "records/templates/*.html",
]

# ----------------------------------------------------------------------------
# Style. Two spaces, one hundred columns, checked by ruff.
#
# The style here is descriptive, not aspirational: it was read off the tree
# that already existed. 99 of 102 modules indent by two, and the 95th
# percentile line is 79 characters, so `line-length = 100` is a wall to catch
# the runaway line, not a target to write up to. Keep writing ~80.
#
# There is deliberately NO formatter. `ruff format` (and black, which is why it
# is no longer in the dev extra) is a 4-space formatter — black cannot do two
# at all — and running either over this tree rewrites 99 files, re-wrapping
# line breaks that were placed by hand to keep a signature or a dict readable.
# The line breaks in this repo carry intent. A formatter cannot see that, so
# the check is a linter and the layout stays a judgement call.
[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py310"
# Anchored with a leading slash: a bare "records" would match any path
# segment of that name and quietly stop linting the rlmcp/records/ package.
# This is the scratch records/ that appears when somebody runs a record
# command with $RLMCP_RECORDS unset.
# examples/go1_flat/genesis_env.py is carried from Genesis with one marked
# change (Apache 2.0, attributed in its header). Restyling vendored upstream
# code to this tree's two spaces would make every future diff against upstream
# unreadable for no gain, so it keeps the shape it arrived in.
extend-exclude = [
    "/records",
    "/.venv",
    "/.venv-server",
    "examples/go1_flat/genesis_env.py",
]

[tool.ruff.lint]
# E1 (indentation) is absent on purpose: those rules assume four spaces.
select = [
  "F",      # pyflakes — undefined names, unused imports, redefinitions
  "E4", "E501", "E7", "E9",  # pycodestyle errors, minus the indent rules
  "W",      # trailing whitespace and friends
  "I",      # import order
  "UP",     # pyupgrade — the repo is py310+, annotations should say so
  "B",      # bugbear — mutable defaults, loop-variable capture, bare zip
  "C4",     # comprehension shortcuts
  "SIM",    # simplifiable branches and context managers
  "RET",    # return-path consistency
  "PIE",    # small dead constructs
  "RUF",    # ruff's own checks
  "DTZ",    # naive datetimes — a record timestamp without a zone is a bug
  "ISC",    # implicit string concatenation, i.e. the comma somebody forgot
  "LOG", "G",  # logging misuse
  "PLE",    # pylint errors
  "PLW",    # pylint warnings
  "TRY",    # exception antipatterns
]

ignore = [
  # This codebase writes long, explanatory messages at the raise site on
  # purpose — an error is supposed to name the fix ("No extension understands
  # {...}. This run has: ..."). TRY003 would push every one of those into a
  # custom exception class and make them worse.
  "TRY003",

  # These helpers are documented to raise ValueError, the CLI turns a
  # ValueError into a message for the user, and the difference between a wrong
  # type and a wrong value is not one that surface makes. Switching them to
  # TypeError is a change to the public behaviour, not a lint fix.
  "TRY004",

  # Module-level singletons -- the pinned stdout of the payload split, the
  # once-only entry-point scan, the CLI's output mode -- are the design here,
  # and `global` is how a module writes to its own state. The alternative is a
  # class whose only instance is a module.
  "PLW0603",
]

# Rules considered and deliberately left out, so nobody re-litigates them:
#
#   BLE001 (blind except)     78 hits. Catching everything is the contract for
#                             inspection code: a screenshot that fails must not
#                             take the training run down with it.
#   ARG00x (unused argument)  131 hits. Adapters implement a protocol; an
#                             implementation that ignores an argument is doing
#                             its job, not forgetting one.
#   T201 (print)              45 hits, all in the CLI, which prints for a living.
#   PLR2004 (magic value)     231 hits, nearly all in test assertions.
#   C901 / PLR0912 / PLR0913  Real, and not enforceable yet: eleven functions
#                             score over 15 on mccabe, topping out at 62
#                             (`_dispatch` in cli.py), and one signature takes
#                             27 arguments. Tracked as its own issue rather
#                             than frozen into a threshold that would
#                             rubber-stamp what is already here.
#
# The long form of all of this, with the reasoning, is docs/style.md.

[tool.ruff.lint.isort]
known-first-party = ["rlmcp"]

[tool.ruff.lint.per-file-ignores]
# An example is read top to bottom; the import that sets a simulator up has to
# come after the flags that configure it.
"examples/*" = ["E402"]
# The long lines in here are inside the embedded JavaScript of the record
# graph. A `# noqa` cannot go on a line that is inside a string literal, and
# re-wrapping somebody else's language to satisfy a Python linter is worse
# than the long line.
"rlmcp/records/views.py" = ["E501"]
