# Runs the test suite exactly the way it is run locally:
#
#   uv run --index https://download.pytorch.org/whl/cpu \
#     --with pytest --with numpy --with matplotlib --with pillow \
#     --with imageio --with torch python -m pytest tests -q
#
# Two dependency variants: the base training-side deps (CPU torch from the
# PyTorch index), and base plus the optional MCP SDK, which un-skips the
# server tests.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # F821 (undefined name) is the check that would have caught `wrap()` raising
    # NameError on every call: byte-compiling cannot see it, and no test reached
    # the line. It costs a second; run it before spending minutes on the suite.
    # The rest of the rule set is in [tool.ruff.lint] in pyproject.toml, so this
    # job and a local `ruff check` cannot disagree about what the style is.
    #
    # The version is pinned. Ruff adds rules in minor releases, and a lint job
    # that goes red because of an upgrade nobody made is a job people learn to
    # ignore. Bump it here, in .pre-commit-config.yaml and in the dev extra
    # together, in a commit that also fixes whatever the new release found.
    runs-on: ubuntu-latest
    name: lint (ruff)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uv run --with ruff==0.16.4 ruff check rlmcp tests examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        deps:
          - { name: base, extra: "" }
          - { name: base+mcp, extra: "--with mcp" }
    name: test (py${{ matrix.python-version }}, ${{ matrix.deps.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: >
          uv run --index https://download.pytorch.org/whl/cpu
          --with pytest --with numpy --with matplotlib --with pillow
          --with imageio --with torch ${{ matrix.deps.extra }}
          python -m pytest tests -q
