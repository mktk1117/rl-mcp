# Rebuilds the `integration` branch: main plus every open PR, merged together.
#
# rl-mcp-studio installs rl-mcp as an editable path dependency, so it sees
# whatever branch is checked out next door. When a studio feature needs code
# that is still spread across two or three open PRs, there is no single branch
# to develop against until those PRs land. This makes one.
#
# The branch is a build artifact, never a place work lives. Nothing is ever
# committed to it by hand and nothing branches off it: it is force-pushed from
# scratch on every run, so it cannot drift, and PRs still target main.
#
# Merges are sequential rather than an octopus, so one conflicting PR is skipped
# and named in the summary instead of taking the whole branch down with it.
#
# The push uses GITHUB_TOKEN, which by design does not trigger further workflow
# runs, so this cannot loop.

name: integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft, labeled, unlabeled]
  workflow_dispatch:

# One rebuild at a time, and drop superseded ones: two runs force-pushing the
# same branch would race, and only the newest answer is worth having.
concurrency:
  group: integration
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  rebuild:
    # Fork PRs get a read-only token, so the push would fail. Skip them rather
    # than fail the run — and note that a fork PR is then absent from the branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: rebuild integration branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Build the branch
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Open, non-draft, same-repo PRs, oldest first so the branch order is
          # stable across runs. Label a PR `no-integrate` to hold it out.
          gh pr list --state open --limit 100 \
            --json number,headRefName,headRepositoryOwner,isDraft,labels,title \
            --jq 'sort_by(.number)[]
                  | select(.isDraft | not)
                  | select(.headRepositoryOwner.login == "${{ github.repository_owner }}")
                  | select([.labels[].name] | index("no-integrate") | not)
                  | [.number, .headRefName, .title] | @tsv' > prs.tsv || true

          git checkout -B integration origin/main

          merged=""; skipped=""
          while IFS=$'\t' read -r num branch title; do
            [ -n "${num:-}" ] || continue
            git fetch -q origin "$branch"
            if git merge --no-ff -m "integration: #$num $title" FETCH_HEAD >/dev/null 2>&1; then
              merged="${merged}- #${num} \`${branch}\` — ${title}"$'\n'
            else
              git merge --abort || true
              skipped="${skipped}- #${num} \`${branch}\` — conflicts with what is already on the branch"$'\n'
            fi
          done < prs.tsv

          {
            echo "## integration branch"
            echo
            echo "Rebuilt from \`main\` at \`$(git rev-parse --short origin/main)\`."
            echo
            if [ -n "$merged" ]; then echo "**Merged**"; echo; echo "$merged"; else echo "No open PRs — \`integration\` is just \`main\`."; fi
            if [ -n "$skipped" ]; then echo; echo "**Skipped**"; echo; echo "$skipped"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A random delimiter, for the same reason the `Report` step below
          # takes its values through `env:`. The list is built out of branch
          # names and PR titles, and one of those containing a line that is
          # exactly the delimiter would close the heredoc early and let the
          # rest of it set whatever step outputs it liked.
          eof="EOF_$(openssl rand -hex 16)"
          { echo "skipped<<$eof"; echo "$skipped"; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v6

      - name: ruff check
        run: uv run --with ruff==0.16.4 ruff check rlmcp tests examples
        continue-on-error: true
        id: lint

      - name: Run tests
        id: tests
        continue-on-error: true
        run: >
          uv run --index https://download.pytorch.org/whl/cpu
          --with pytest --with numpy --with matplotlib --with pillow
          --with imageio --with torch
          python -m pytest tests -q

      # Pushed even when the tests fail: the branch's job is to say honestly what
      # the open PRs look like together, and a red run is how you find out that
      # two of them disagree. Flip this to `if: steps.tests.outcome == 'success'`
      # if you would rather studio keep building against the last good union.
      # Plain --force: the branch is regenerated wholesale every run, and the
      # concurrency group above is what keeps two runs from racing on it.
      # (--force-with-lease would need an origin/integration tracking ref that
      # this checkout never fetches.)
      - name: Push
        run: git push --force origin integration

      # Every `${{ }}` here goes through `env:`, never into the script text.
      # The skipped list is built out of branch names and PR titles, so it is
      # somebody else's writing; pasted into the script it is read as shell.
      # It already was: the backticks this step puts around a branch name came
      # back as command substitution, and a run that skipped `check-task`
      # reported `check-task: command not found` instead of naming the PR that
      # went missing. A branch named for what that implies would have run.
      - name: Report
        env:
          TESTS: ${{ steps.tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          SKIPPED: ${{ steps.build.outputs.skipped }}
        run: |
          set -euo pipefail
          if [ "$TESTS" != "success" ] || [ "$LINT" != "success" ]; then
            echo "The open PRs do not pass together — \`integration\` was still pushed, but it is broken." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "$SKIPPED" ]; then
            echo "Some PRs are missing from the branch (see above)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
